<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#F5C400" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Zentex – Sprinkler App</title>

  <style>
    :root{
      --zentex-yellow:#F5C400;
      --ink:#111;
      --muted:#6b7280;
      --bg:#F6F7F9;
      --card:#fff;
      --radius:18px;
      --shadow: 0 14px 32px rgba(0,0,0,.10);
      --line: rgba(17,17,17,.10);
    }
    *{box-sizing:border-box}

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 20% 10%, rgba(245,196,0,.18), transparent 60%),
        radial-gradient(900px 500px at 90% 20%, rgba(0,0,0,.08), transparent 55%),
        var(--bg);
      padding: 22px 14px;
    }

    .wrap{
      min-height: calc(100vh - 44px);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .card{
      width: min(560px, 100%);
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(17,17,17,.08);
      border-radius: 26px;
      box-shadow: var(--shadow);
      padding: 22px;
      position: relative;
      overflow:hidden;
    }

    .watermark{
      position:absolute;
      right:-120px;
      bottom:-140px;
      width:520px;
      height:520px;
      opacity:.05;
      background: url("./assets/logo.jpg") no-repeat center/contain;
      transform: rotate(-10deg);
      pointer-events:none;
      filter: grayscale(100%);
    }

    .top{
      display:flex;
      justify-content:center;
      align-items:center;
      margin: 4px 0 18px;
    }

    .logo{
      max-width: 260px;
      width: 70%;
      height: auto;
      display:block;
    }

    .grid{
      display:grid;
      gap: 12px;
      margin-top: 8px;
    }

    .btn{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 14px;
      padding: 16px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      text-decoration:none;
      cursor:pointer;
      transition: transform .06s ease;
    }
    .btn:active{ transform: translateY(1px); }

    .btn.primary{
      background: linear-gradient(180deg, rgba(245,196,0,1), rgba(245,196,0,.88));
      border-color: rgba(17,17,17,.14);
    }

    .bt-title{
      font-weight: 950;
      font-size: 14px;
      letter-spacing:.2px;
    }
    .bt-sub{
      margin-top: 4px;
      font-size: 12px;
      color: rgba(17,17,17,.70);
      font-weight: 650;
      line-height:1.25;
    }
    .arrow{
      font-size: 18px;
      opacity: .75;
      font-weight: 900;
      flex: 0 0 auto;
    }

    .footer{
      margin-top: 14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap: 10px;
      flex-wrap:wrap;
    }

    .pill{
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.70);
      color: var(--muted);
      font-size: 12px;
      white-space:nowrap;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="watermark"></div>

      <div class="top">
        <img src="./assets/logo.jpg" alt="Zentex Brandschutz AG" class="logo"
             onerror="this.style.display='none';">
      </div>

      <div class="grid">
        <a class="btn primary" href="./instandsetzung.html">
          <div>
            <div class="bt-title">CHECKLISTE – Instandhaltung für Sprinkleranlagen</div>
          </div>
          <div class="arrow">›</div>
        </a>

        <a class="btn" href="./regie.html">
          <div>
            <div class="bt-title">Regie - Rapport</div>
          </div>
          <div class="arrow">›</div>
        </a>

        <a class="btn" href="./offline.html">
          <div>
            <div class="bt-title">Letzte 50 Jobs (offline)</div>
            <div class="bt-sub">Mit Status, Suche, Filter und Sperre für abgeschlossene Jobs</div>
          </div>
          <div class="arrow">›</div>
        </a>
      </div>

      <div class="footer">
        <div class="pill" id="netState">Netz: prüfen…</div>
        <div class="pill">v1.0</div>
      </div>
    </div>
  </div>

  <script>
    const el = document.getElementById("netState");
    function upd(){ el.textContent = "Netz: " + (navigator.onLine ? "online" : "offline"); }
    window.addEventListener("online", upd);
    window.addEventListener("offline", upd);
    upd();
  </script>
  <script>
    (function () {
      if (!("serviceWorker" in navigator)) return;
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js").catch(function (err) {
          console.warn("Service Worker Registrierung fehlgeschlagen:", err);
        });
      });
    })();
  </script>
</body>
</html>
